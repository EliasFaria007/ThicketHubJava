spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/thickethub_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Elefantamon1.}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:no-reply@defensoria.mg.gov.br}
    password: ${MAIL_PASSWORD:secret}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

storage:
  r2:
    endpoint: ${R2_ENDPOINT:https://c9b9b0451c30540f46252204286bb023.r2.cloudflarestorage.com}
    access-key: ${R2_ACCESS_KEY:8f9ff996ed8193429128b13467a393e7}
    secret-key: ${R2_SECRET_KEY:4f07b41d88396ab22220cd79b588b71a9d4d7bba8966c908eff7c61b9b0dafa6}
    bucket-name: ${R2_BUCKET_NAME:thickethub-arquivos}
    public-url: ${R2_PUBLIC_URL:https://pub-93c86b28bf944ce1a4813316cada32ba.r2.dev}

management:
  health:
    mail:
      enabled: false
    redis:
      enabled: false

logging:
  level:
    thickethub: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    root: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%-5level] %logger{30} — %msg%n"
