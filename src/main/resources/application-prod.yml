spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require&prepareThreshold=0&preparedStatementCacheQueries=0&tcpKeepAlive=true}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:20000}
      idle-timeout: ${DB_IDLE_TIMEOUT:300000}
      max-lifetime: ${DB_MAX_LIFETIME:600000}
      keepalive-time: ${DB_KEEPALIVE_TIME:30000}
      leak-detection-threshold: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  mail:
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:resend}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:no-reply@thickethub.dev.br}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

storage:
  r2:
    endpoint: ${R2_ENDPOINT:https://c9b9b0451c30540f46252204286bb023.r2.cloudflarestorage.com}
    access-key: ${R2_ACCESS_KEY:8f9ff996ed8193429128b13467a393e7}
    secret-key: ${R2_SECRET_KEY:4f07b41d88396ab22220cd79b588b71a9d4d7bba8966c908eff7c61b9b0dafa6}
    bucket-name: ${R2_BUCKET_NAME:thickethub-arquivos}
    public-url: ${R2_PUBLIC_URL:https://pub-93c86b28bf944ce1a4813316cada32ba.r2.dev}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    mail:
      enabled: false
    redis:
      enabled: false

logging:
  level:
    thickethub: INFO
    org.springframework.security: WARN
